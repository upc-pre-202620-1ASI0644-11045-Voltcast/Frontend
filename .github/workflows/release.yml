name: Release APK

# Un PR mergeado a main y un commit directo a main son ambos un push a main.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8 # la misma que en local; el stable más nuevo exige un AGP más reciente
          channel: stable
          cache: true

      # Secrets que no están en el repo (ver .gitignore).
      - name: Restore google-services.json and signing key
        run: |
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json
          mkdir -p ~/.android
          echo '${{ secrets.DEBUG_KEYSTORE_BASE64 }}' | base64 -d > ~/.android/debug.keystore

      # MAJOR.MINOR sale de pubspec.yaml (0.1.0+1 -> 0.1); el patch y el build number son el run_number.
      - name: Compute version
        run: |
          base=$(grep -oP '^version: \K\d+\.\d+' pubspec.yaml)
          echo "VERSION=$base.${{ github.run_number }}" >> "$GITHUB_ENV"

      - run: flutter pub get

      # +100 para quedar siempre por encima del versionCode 1 de los builds manuales previos.
      - name: Build APK
        run: >
          flutter build apk --release
          --build-name=$VERSION
          --build-number=$(( ${{ github.run_number }} + 100 ))
          --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk voltcast-$VERSION.apk
          gh release create "v$VERSION" "voltcast-$VERSION.apk" \
            --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes
